<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>친구 목록</title>
    <link rel="stylesheet" href="../sidebar/style_sidebar.css">
    <link rel="stylesheet" href="style_friends_list.css">
</head>
<body>


    <div id="mySidenav" class="sidenav">
        <a href="#" class="closebtn" onclick="toggleNav()">
            <img src="../assets/close.svg" alt="접기">
            접기
            </a>
        <a href="#" class="home-link">홈</a>
        <a href="#" class="record-link">나의 기록</a>
        <a href="#" class="mypage-link">마이페이지</a>
        <a href="#" class="friend-link">친구 관리</a>
        <a href="#" class="setting-link">
            <img src="../assets/setting.svg" alt="설정">
                 설정
        </a>
        <a href="#" class="dm-link">
            <img src="../assets/message.svg" alt="디엠">
        </a>
        <a href="#" class="alarm-link">
            <img src="../assets/alarm.svg" alt="알람">
        </a>

        <a href="#" class="notify-link">
            <img src="../assets/notify.svg" alt="공지">
        </a>

        <a href="#" class="profile-link">
            <img src="../assets/logout.svg" alt="로그아웃">
        </a>

        <a href="#" class="logout-link">로그아웃</a>

    </div>
    
    <span class="arrow" onclick="toggleNav()">
        <img src="../assets/open.svg" alt="열기" class="openbtn">
        
    </span>

        
<div id="main">
    <h1>친구 목록</h1>
    
<div class="fri-list">
    <form id="add-friend-form">
        <input type="text" id="friend-nickname" placeholder="친구 검색">
        <button type="submit">
            <img src="search.svg">           
        </button>
    </form>
</div>
<div>
    <!-- <h2>Pending Friend Requests</h2> -->
    <ul id="pending-requests">
        <!-- Pending requests will be listed here -->


        <div class="content">
            <div class="friend-list-header">
                <div class="friend-icon-container" id="friendNotificationIcon">
                    <img src="notify.svg" alt="친구 알림 아이콘" class="friend-icon">
                    <span class="notification-dot"></span>
                </div>
                <!-- 친구 목록 -->
            </div>
            <div class="friend-list">
                <!-- 친구 목록 아이템 -->
            </div>
        </div>
    
   
        

        <div id="popup" class="popup">
            <div class="popup-content">
                <span class="close-btn" id="closeBtn">&times;</span>
                <h2>친구 요청</h2>
                <div class="friend-request">
                    <div class="friend-request-item">
                        <img src="profile1.svg" alt="프로필 사진">
                        <div class="friend-info">
                            <p>길동이</p>
                            <p>gildong@gmail.com</p>
                        </div>
                        <div class="friend-actions">
                            <button class="reject-btn"><img src="x.svg" alt="엑스" class="check-button"></button>
                            <button class="accept-btn"><img src="o.svg" alt="체크" class="check-button"></button>
                        </div>
                    </div>
                    <div class="friend-request-item">
                        <img src="profile2.svg" alt="프로필 사진">
                        <div class="friend-info">
                            <p>길동길동</p>
                            <p>gildonggg@gmail.com</p>
                        </div>
                        <div class="friend-actions">
                            <button class="reject-btn"><img src="x.svg" alt="엑스" class="check-button"></button>
                            <button class="accept-btn"><img src="o.svg" alt="체크" class="check-button"></button>
                        </div>
                    </div>
                    <div class="friend-request-item">
                        <img src="profile5.svg" alt="프로필 사진">
                        <div class="friend-info">
                            <p>시애기</p>
                            <p>eungae@gmail.com</p>
                        </div>
                        <div class="friend-actions">
                            <button class="reject-btn"><img src="x.svg" alt="엑스" class="check-button"></button>
                            <button class="accept-btn"><img src="o.svg" alt="체크" class="check-button"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    




    </ul>
</div>
<div>
    <!-- Friends -->
    <ul class="friend-list" id="friendList">
        <li class="friend-item">
            <img src="profile1.svg" alt="Profile" class="profile-pic">
            <span class="nickname">지존예진..-_^</span>
            <button id="toggleButton" class="visibility-button"><img src="eye_close.svg" alt="눈"></button>
            <button class="favorite-button"><img src="star.svg" alt="별" class="star-button"></button>
            <button class="delete-button" onclick="confirmDelete(this)">-</button>
        </li>
        <li class="friend-item">
            <img src="profile2.svg" alt="Profile" class="profile-pic">
            <span class="nickname">나는채연아가야</span>
            <button id="toggleButton" class="visibility-button"><img src="eye_close.svg" alt="눈"></button>
            <button class="favorite-button"><img src="star.svg" alt="별" class="star-button"></button>
            <button class="delete-button" onclick="confirmDelete(this)">-</button>
        </li>
        <li class="friend-item">
            <img src="profile3.svg" alt="Profile" class="profile-pic">
            <span class="nickname">최강예현</span>
            <button id="toggleButton" class="visibility-button"><img src="eye_open.svg" alt="눈"></button>
            <button class="favorite-button"><img src="xstar.svg" alt="별" class="star-button"></button>
            <button class="delete-button" onclick="confirmDelete(this)">-</button>
        </li>
        <li class="friend-item">
            <img src="profile4.svg" alt="Profile" class="profile-pic">
            <span class="nickname">허다닥</span>
            <button id="toggleButton" class="visibility-button"><img src="eye_open.svg" alt="눈"></button>
            <button class="favorite-button"><img src="xstar.svg" alt="별" class="star-button"></button>
            <button class="delete-button" onclick="confirmDelete(this)">-</button>
        </li>
    </ul>
</div>
</div>


<script src="../sidebar/script_sidebar.js"></script>
<script src="script_friends_list.js"></script>
</body>
</html>
