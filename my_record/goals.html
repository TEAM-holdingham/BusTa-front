        <a href="#" class="dm-link">
            <img src="../assets/message.svg" alt="디엠">
        </a>
        <a href="#" class="alarm-link">
            <img src="../assets/alarm.svg" alt="알람">

        </a>

        <a href="#" class="logout-link">로그아웃</a>

    </div>

    <span class="arrow" onclick="toggleNav()">
        <img src="../assets/open.svg" alt="열기" class="openbtn">

    </span>

    <div class="record-container">
        <header>
            <h2>나의 기록</h2>
            <nav>
                <a href="goals.html" class="active">오늘의 목표</a>
                <a href="timelaps.html">타임 랩스</a>
            </nav>
        </header>
        <div id="main">
            <div class="date-header">
                <div class="date-info">
                    <!--
                    <button class="date-icon" id="dateButton">
                        <img src="calendar.svg" alt="캘린더 아이콘">
                    </button>-->
                    <div class="date-icon"><img src="calendar.svg"></div>
                    <div id="calendarPopup" class="calendar-popup">
                        <input type="date" id="datePicker">
                    </div>
                </div>
                <button class="delete-btn">삭제</button>
            </div>            
            <ul class="task-list">
                <li class="task completed">
                    총알 오징어 (1/4) 듣기
                    <button class="remove-task-btn" style="display:none;">-</button>
                </li>
                <li class="task completed">
                    총알 오징어 (1/4) 노션에 정리하기
                    <button class="remove-task-btn" style="display:none;">-</button>
                </li>
                <li class="task pending">
                    목표 설정 UI 디자인 하기
                    <button class="remove-task-btn" style="display:none;">-</button>
                </li>
                <li class="task pending">
                    총알 오징어 (2/4) 듣기
                    <button class="remove-task-btn" style="display:none;">-</button>
                </li>
                <li class="task add-task">
                    <button id="addTaskButton">목표 추가하기</button>
                </li>
            </ul>

                <!-- Task Creation Popup -->
    <div id="taskPopup" class="popup">
        <div class="popup-content">
            <span class="close">&times;</span>
            <h1>목표 생성</h1>
            <form id="taskForm">
                <textarea name="task" id="task" cols="72" rows="12" placeholder="목표 내용을 입력하세요"></textarea>
                <br>
                <button type="submit">저장</button>
                <button id="cancelTaskButton" type="button">취소</button>
            </form>
        </div>
    </div>
    
        </div>
    </div>
