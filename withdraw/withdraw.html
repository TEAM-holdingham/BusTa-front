<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원탈퇴</title>
    <link rel="stylesheet" href="style_withdraw.css">
</head>
<body>

    <div class="container">
        <h1>회원탈퇴</h1>
        <p>회원 탈퇴하기에 앞서 안내사항을 반드시 확인해주세요.</p>

        <div class="notice">
            <h3>1. 탈퇴 신청한 이메일 30일 재가입 불가</h3>
            <p>탈퇴한 이메일은 탈퇴한 일로부터 30일 동안 재가입이 불가능합니다. 신중히 선택하신 후 결정해 주세요.</p>
            <h3>2. 내 정보 및 서비스 이용 기록 삭제</h3>
            <p>사이트에 등록된 회원정보, 이용정보 등 모든 내용이 삭제되며, 삭제된 데이터는 복구되지 않습니다. 필요한 데이터는 미리 백업을 해주세요.</p>
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="agree">
            <label for="agree">안내사항을 모두 확인하였으며, 이에 동의합니다.</label>
        </div>

        <div class="email-info">
            seungyeonsi913@gmail.com님이 떠나시는 이유가 궁금해요.
        </div>

        <div class="textarea-container">
            <textarea placeholder="서비스 탈퇴 사유에 대해 알려주세요. 고객님의 소중한 피드백을 담아 더 나은 서비스로 보답 드리도록 하겠습니다."></textarea>
        </div>

        <div class="buttons">
            <button class="confirm-btn">확인</button>
        </div>
        <div class="buttons">
            <button class="close-btn">닫기</button>
        </div>
    </div>

</body>
</html>
